name: Deploy to Alexa-Hosted

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'skill-package/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/deploy.yml'
      - 'ask-resources.json'
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy skill
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install ASK CLI
        run: npm install -g ask-cli

      - name: Configure ASK credentials
        env:
          ASK_ACCESS_TOKEN: ${{ secrets.ASK_ACCESS_TOKEN }}
          ASK_REFRESH_TOKEN: ${{ secrets.ASK_REFRESH_TOKEN }}
          ASK_VENDOR_ID: ${{ secrets.ASK_VENDOR_ID }}
        run: |
          mkdir -p ~/.ask
          cat > ~/.ask/cli_config << EOF
          {
            "profiles": {
              "default": {
                "token": {
                  "access_token": "${ASK_ACCESS_TOKEN}",
                  "refresh_token": "${ASK_REFRESH_TOKEN}",
                  "token_type": "bearer"
                },
                "vendor_id": "${ASK_VENDOR_ID}"
              }
            }
          }
          EOF

      - name: Inject skill ID into ask-resources.json
        env:
          SKILL_ID: ${{ secrets.SKILL_ID }}
        run: |
          if [ -z "$SKILL_ID" ]; then
            echo "Error: SKILL_ID secret is not set"
            exit 1
          fi
          jq --arg id "$SKILL_ID" '.profiles.default.skillId = $id' ask-resources.json > tmp.json
          mv tmp.json ask-resources.json
          echo "--- ask-resources.json after injection ---"
          cat ask-resources.json
          echo "------------------------------------------"

      - name: Deploy to Alexa-Hosted
        run: ask deploy --profile default --debug
